name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned test tools and the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.17.3 pytest==9.2.0 pytest-qt==4.5.0
          python -m pip install -e .
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Pytest
        run: python -m pytest -q

  test-py313:
    runs-on: windows-latest
    continue-on-error: true  # compatibility signal only; required check is 'test'
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned test tools and the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.17.3 pytest==9.2.0 pytest-qt==4.5.0
          python -m pip install -e .
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Pytest
        run: python -m pytest -q
