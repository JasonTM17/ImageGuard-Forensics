name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned test tools and the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.17.3 pytest==9.2.0 pytest-qt==4.5.0 pytest-cov==7.0.0
          python -m pip install -e .
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Pytest
        run: python -m pytest -q --cov=imageguard --cov-report=term-missing

  test-linux:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3
      - name: Install pinned test tools and the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.17.3 pytest==9.2.0 pytest-qt==4.5.0
          python -m pip install -e .
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Pytest
        run: python -m pytest -q

  package-smoke:
    runs-on: windows-latest
    continue-on-error: true  # packaging signal only; required check is 'test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project with dev + ONNX extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,lama]"
      - name: PyInstaller build
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_app.ps1
      - name: Verify packaged Haar Cascade data
        run: |
          $cascade = @(Get-ChildItem -LiteralPath 'dist/ImageGuard' -Recurse -File -Filter 'haarcascade_frontalface_default.xml')
          if ($cascade.Count -ne 1) { throw 'Expected one packaged frontal-face Haar Cascade XML.' }
          if ($cascade[0].Length -eq 0) { throw 'Packaged Haar Cascade XML is empty.' }
      - name: Smoke-test packaged startup
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = Get-Item -LiteralPath 'dist/ImageGuard/ImageGuard.exe'
          $db = Join-Path $exe.DirectoryName 'data/imageguard.db'
          if (Test-Path -LiteralPath $db) { throw 'Expected a fresh package database.' }
          $process = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -WindowStyle Hidden -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              if ($process.HasExited) { throw "ImageGuard exited during startup (code $($process.ExitCode))." }
              if (Test-Path -LiteralPath $db) { break }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $deadline)
            if (!(Test-Path -LiteralPath $db)) { throw 'ImageGuard did not create its database within 30 seconds.' }
            if ($process.HasExited) { throw "ImageGuard exited during startup (code $($process.ExitCode))." }
          } finally {
            if (!$process.HasExited) {
              Stop-Process -InputObject $process -ErrorAction SilentlyContinue
              if (!$process.WaitForExit(5000)) { throw 'The packaged startup process did not stop.' }
            }
            $process.Dispose()
          }

  test-py313:
    runs-on: windows-latest
    continue-on-error: true  # compatibility signal only; required check is 'test'
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned test tools and the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.17.3 pytest==9.2.0 pytest-qt==4.5.0
          python -m pip install -e .
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Pytest
        run: python -m pytest -q
