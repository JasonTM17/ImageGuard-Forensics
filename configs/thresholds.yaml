# Mọi ngưỡng thuật toán tập trung tại đây — cấm hardcode trong module forensics.
# Schema mỗi key: {value, unit?, source, range?}
#   source: "literature — <citation>" | "default — chưa hiệu chuẩn" | "calibrated:<experiment_id>"
version: 1

limits:
  max_file_bytes: { value: 104857600, unit: bytes, source: "default — chống decompression bomb (100MB)" }
  max_pixels: { value: 80000000, unit: px, source: "default — 80MP, kiểm tra header trước decode" }
  min_side: { value: 64, unit: px, source: "default — dưới ngưỡng này không đủ tín hiệu → INCONCLUSIVE" }
  work_max_side: { value: 2048, unit: px, source: "default — working copy cho detector, ghi resolution_reduced" }
  aux_max_side: { value: 4096, unit: px, source: "default — working copy cho noise/freq aux (integral float64/FFT complex128 ~10-25 byte/px; 80MP sẽ >2GB)" }

keypoint:
  backend: { value: sift, source: "default — SIFT mainline từ OpenCV 4.4; orb là fallback" }
  nfeatures: { value: 0, source: "default — 0 = không giới hạn, để OpenCV quyết định" }
  ratio_rho: { value: 0.8, unit: ratio, source: "literature — Lowe 2004, ratio test d1/d2", range: [0.6, 0.9] }
  min_match_dist: { value: 20, unit: px, source: "default — loại cặp keypoint quá sát nhau" }
  min_cluster: { value: 3, source: "default — cluster tối thiểu để đưa vào geometric verify" }
  k_min: { value: 50, source: "default — tổng keypoints < ngưỡng → INCONCLUSIVE (ít texture)" }
  ransac_residual: { value: 3.0, unit: px, source: "default — inlier threshold cho affine RANSAC" }
  t_susp: { value: 10, source: "default — verified matches ≥ ngưỡng → SUSPICIOUS" }
  t_clean: { value: 4, source: "default — verified matches < ngưỡng → NO_INDICATION; giữa → INCONCLUSIVE" }

block:
  block_size: { value: 16, unit: px, source: "literature — Fridrich/Popescu baseline" }
  sim_thresh: { value: 0.95, source: "default — ngưỡng tương tự feature hàng kề" }
  min_shift_votes: { value: 8, source: "default — shift vector tối thiểu để giữ" }
  min_block_dist: { value: 32, unit: px, source: "default — loại cặp block dính nhau" }
  max_side: { value: 768, unit: px, source: "default — block pipeline cap riêng; N_b ~ (side-B)^2 → 2048 quá nặng" }
  n_coeffs: { value: 24, source: "default — số hệ số DCT zigzag đầu giữ lại làm feature" }
  min_area_frac: { value: 0.01, unit: frac, source: "default — mask/img ≥ ngưỡng → SUSPICIOUS; >0 → INCONCLUSIVE" }
  flat_std_eps: { value: 5.0, unit: gray, source: "literature — Fridrich: loại flat blocks khỏi matching (nguồn false-match chính)" }

ela:
  qualities: { value: [75, 85, 90, 95], source: "default — sweep chất lượng re-encode JPEG" }
  amplify: { value: 15, source: "default — hệ số khuếch đại difference map" }
  indication_p99: { value: 0.2, unit: frac, source: "default — p99 heat ≥ ngưỡng → INCONCLUSIVE (ELA không bao giờ trả SUSPICIOUS)" }

noise:
  median_k: { value: 5, unit: px, source: "default — kernel median blur cho residual" }
  outlier_mad: { value: 3.0, unit: MAD, source: "default — block σ lệch median ± m·MAD → outlier" }
  block: { value: 16, unit: px, source: "default — kích thước block đo σ noise" }
  min_outlier_frac: { value: 0.005, unit: frac, source: "default — outlier ≥ tỉ lệ này mới tính là 'có vùng bất thường'" }
  local_k: { value: 5, unit: blocks, source: "default — kernel median láng giềng cho local-MAD (chỉ 3 hoặc 5 với float32)", range: [3, 5] }
  local_z: { value: 4.0, unit: z, source: "default — |z| = |σ−local_med|/1.4826·local_MAD ≥ ngưỡng → seam-ring evidence" }
  local_min_frac: { value: 0.002, unit: frac, source: "default — flagged-block ≥ tỉ lệ này → INCONCLUSIVE" }
  low_sigma_ratio: { value: 0.6, unit: ratio, source: "provisional empirical threshold from synthetic LaMa experiments; re-evaluated after ModelForge move-mask repair; not calibrated on real photographs" }
  region_sigma_ratio: { value: 0.45, unit: ratio, source: "provisional empirical filter from synthetic LaMa experiments; corrected clean controls still emitted a non-empty cue mask on 1/12 train and 1/6 holdout images; not a zero-false-positive claim" }
  min_region_blocks: { value: 6, unit: blocks, source: "default — connected component ≥ N block mới giữ (loại nhiễu lẻ)" }

freq:
  blockiness_t: { value: 0.08, unit: frac, source: "default — chênh gradient biên 8x8 trung bình ≥ ngưỡng → dấu vết nén block" }


deepfake_ml:
  fake_thresh: { value: 0.7, source: "provisional - ngưỡng thử nghiệm; chưa hiệu chuẩn hoặc xác nhận trên bộ độc lập có nhãn", range: [0.5, 1.0] }
  real_thresh: { value: 0.3, source: "provisional — ngưỡng dưới của vùng xám; đối xứng fake_thresh quanh quy tắc argmax gốc 0.5", range: [0.0, 0.5] }
  detect_max_side: { value: 1280, unit: px, source: "default — cap cỡ ảnh cho YuNet detection; crop vẫn từ pixel gốc" }

deepfake_screen_coc:
  fake_thresh: { value: 0.7, source: "provisional — ngưỡng thận trọng cho CoC Xception; benchmark tác giả dùng >0.5 nhưng chưa hiệu chuẩn ngoài benchmark", range: [0.5, 1.0] }
  real_thresh: { value: 0.3, source: "provisional — ngưỡng dưới của vùng xám; giữ kết quả trung lập thay vì phán đoán mạnh", range: [0.0, 0.5] }
  detect_max_side: { value: 1280, unit: px, source: "default — cap cỡ ảnh cho YuNet detection; alignment/crop vẫn từ pixel gốc" }

# Ensemble nhận diện deepfake: trung bình có trọng số các điểm fake [0,1] của
# các detector khả dụng (cues hoặc DIP đã học, GenConViT-ED, CoC Xception).
# Trọng số mặc định CHƯA hiệu chuẩn trên bộ có nhãn — đổi giá trị không tự
# khẳng định độ chính xác; chấm bằng scripts/evaluate_deepfake_ensemble.py.
deepfake_ensemble:
  fake_thresh: { value: 0.7, source: "provisional — ngưỡng trên của điểm tổng hợp; chưa hiệu chuẩn trên bộ độc lập có nhãn", range: [0.5, 1.0] }
  real_thresh: { value: 0.3, source: "provisional — ngưỡng dưới của vùng xám; chưa hiệu chuẩn", range: [0.0, 0.5] }
  min_members: { value: 2, unit: detectors, source: "default — cần ít nhất N detector khả dụng mới ra verdict; dưới mức này luôn INCONCLUSIVE", range: [1, 3] }
  weight_deepfake_cues: { value: 1.0, source: "default — trọng số bộ 6 trụ cột cổ điển; chưa hiệu chuẩn", range: [0.0, 10.0] }
  weight_learned_dip: { value: 2.0, source: "default — trọng số mô hình DIP học từ dữ liệu có nhãn của nhóm; chưa hiệu chuẩn ngoài dev", range: [0.0, 10.0] }
  weight_deepfake_ml: { value: 2.0, source: "default — trọng số GenConViT-ED; chưa hiệu chuẩn ngoài domain train", range: [0.0, 10.0] }
  weight_deepfake_screen: { value: 1.5, source: "default — trọng số CoC Xception (chỉ đúng domain screen-recapture); chưa hiệu chuẩn", range: [0.0, 10.0] }

splicing:
  overlap_frac: { value: 0.15, unit: frac, source: "default — (noise_outlier ∩ ELA_hot)/ELA_hot ≥ ngưỡng → corroboration" }

# Heuristic exploration only. These defaults have NOT been calibrated on a
# labeled real/deepfake dataset; changing them does not establish accuracy.
deepfake:
  score_thresh: { value: 0.35, unit: index, source: "default — chưa hiệu chuẩn; chỉ số dấu hiệu, không phải xác suất giả", range: [0.0, 1.0] }
  min_face_side: { value: 64, unit: px, source: "default — kích thước ROI làm việc tối thiểu cho texture/phổ", range: [16, 512] }
  min_reference_blocks: { value: 4, unit: blocks, source: "default — tối thiểu số block nền độc lập ngoài ROI", range: [1, 4096] }
  min_roi_contrast: { value: 8.0, unit: gray, source: "default — p95−p5 trong ROI; dưới mức này không đủ tương phản", range: [0.0, 255.0] }
  smooth_support: { value: 0.45, unit: index, source: "default — chưa hiệu chuẩn; hỗ trợ nhóm texture", range: [0.0, 1.0] }
  region_support: { value: 0.20, unit: frac, source: "default — chưa hiệu chuẩn; tỷ lệ block hỗ trợ texture", range: [0.0, 1.0] }
  lbp_support: { value: 0.18, unit: index, source: "default — chưa hiệu chuẩn; hỗ trợ nhóm texture", range: [0.0, 1.0] }
  freq_support: { value: 0.55, unit: index, source: "default — chưa hiệu chuẩn; hỗ trợ nhóm phổ", range: [0.0, 1.0] }
  seam_support: { value: 0.65, unit: index, source: "default — chưa hiệu chuẩn; hỗ trợ nhóm biên", range: [0.0, 1.0] }
  hough_support: { value: 0.70, unit: index, source: "default — chưa hiệu chuẩn; hỗ trợ nhóm biên", range: [0.0, 1.0] }
