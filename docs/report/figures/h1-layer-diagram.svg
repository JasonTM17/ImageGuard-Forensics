<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">Kiến trúc layer — ImageGuard Forensics</text>

  <g>
    <rect x="60" y="48" width="440" height="64" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="76" y="72" font-size="14" font-weight="600" fill="#1e3a8a">UI (PySide6 Qt Widgets)</text>
    <text x="76" y="92" font-size="12" fill="#1e3a8a">QGraphicsView viewer · worker bridge · 5 tab</text>
    <text x="76" y="106" font-size="11" fill="#3b5bdb">(thread GUI sở hữu widget)</text>
  </g>
  <line x1="280" y1="112" x2="280" y2="136" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <g>
    <rect x="60" y="140" width="440" height="64" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="76" y="164" font-size="14" font-weight="600" fill="#312e81">Services</text>
    <text x="76" y="184" font-size="12" fill="#312e81">AnalysisService · HistoryService</text>
    <text x="76" y="198" font-size="11" fill="#4338ca">EvaluationService · ReportService (export Markdown)</text>
  </g>
  <line x1="280" y1="204" x2="280" y2="228" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <g>
    <rect x="60" y="232" width="440" height="80" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="76" y="256" font-size="14" font-weight="600" fill="#14532d">Forensics engine (Qt-free, headless)</text>
    <text x="76" y="276" font-size="12" fill="#14532d">keypoint/ · block/ · auxiliary/ (ela, noise, freq, meta)</text>
    <text x="76" y="292" font-size="12" fill="#14532d">localize/ mask fusion · heatmap</text>
    <text x="76" y="306" font-size="11" fill="#15803d">fusion.combine() — luật verdict thận trọng</text>
  </g>
  <line x1="280" y1="312" x2="280" y2="336" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <g>
    <rect x="60" y="340" width="440" height="64" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
    <text x="76" y="364" font-size="14" font-weight="600" fill="#713f12">Core domain</text>
    <text x="76" y="384" font-size="12" fill="#713f12">models · enums · errors · limits · config</text>
    <text x="76" y="398" font-size="11" fill="#a16207">io (safe_open) · metadata · preprocess</text>
  </g>

  <g>
    <rect x="540" y="140" width="180" height="264" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="630" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Tầng hỗ trợ</text>
    <line x1="560" y1="176" x2="700" y2="176" stroke="#9ca3af"/>
    <text x="560" y="200" font-size="12" font-weight="600" fill="#374151">Enhancement</text>
    <text x="560" y="216" font-size="10.5" fill="#4b5563">derive / NAFNet view (chỉ xem)</text>
    <text x="560" y="244" font-size="12" font-weight="600" fill="#374151">Ingest</text>
    <text x="560" y="260" font-size="10.5" fill="#4b5563">folder scan · custody JSONL</text>
    <text x="560" y="288" font-size="12" font-weight="600" fill="#374151">Evaluation</text>
    <text x="560" y="304" font-size="10.5" fill="#4b5563">synthforge · metrics R1–R5 · studies</text>
    <text x="560" y="332" font-size="12" font-weight="600" fill="#374151">Persistence</text>
    <text x="560" y="348" font-size="10.5" fill="#4b5563">SQLite + artifact store</text>
    <text x="560" y="376" font-size="12" font-weight="600" fill="#374151">IPKit</text>
    <text x="560" y="392" font-size="10.5" fill="#4b5563">toán tử NumPy-only (demo)</text>
  </g>
  <line x1="500" y1="272" x2="540" y2="272" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,3"/>

  <text x="380" y="440" text-anchor="middle" font-size="11" fill="#6b7280">Engine Qt-free: core/, forensics/, evaluation/, enhancement/, ingest/ không import PySide6 — kiểm thử headless bằng pytest.</text>
</svg>
